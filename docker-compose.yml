services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pdf-extractext
    ports:
      - "8000:8000"
    # SOLO EN ETAPA DE DESARROLLO
    volumes: 
      - .:/app 
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pdf-extractext-network

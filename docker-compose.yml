# Informa a docker sobre los contenedores que se quieren "levantar".
version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.default.acme.tlschallenge=true
      - --certificatesresolvers.default.acme.email=tuemail@ejemplo.com
      - --certificatesresolvers.default.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels: 
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.universidad.localhost`)"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - pdf-extractext-network

  monolith-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: pdf-extractext:1.0.1
    container_name: pdf-extractext
    networks:
      - pdf-extractext-network
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monolith-api.rule=Host(`universidad.localhost`)"
      - "traefik.http.routers.monolith-api.entrypoints=websecure"
      - "traefik.http.routers.monolith-api.tls=true"
      - "traefik.http.services.monolith-api.loadbalancer.server.port=8000"

  mongodb:
    image: mongo:7-jammy
    container_name: pdf-extractext-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongodb_data:/data/db
    networks:
      - pdf-extractext-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongodb_data:

networks:
  pdf-extractext-network:
    driver: bridge